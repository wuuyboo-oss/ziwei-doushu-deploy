# Cloudflare Workers（OpenNext）配置 — 未验证，仅作准备，见 BUILD-NOTES
#
# 关键限制，部署前必须先解决，否则不要直接用：
# 1. 本项目是标准 Node 服务（`next start` + `child_process` 调 DeepSeek helper 的
#    python 子进程），Workers 里没有子进程、没有 python helper，AI 只能走
#    环境变量 DEEPSEEK_API_KEY 的 HTTP 直调（/api/interpret 已支持这条路，
#    helper 不存在时自动用 env-key）。
# 2. 免费档 Worker 压缩后上限 3 MiB、每请求 CPU 10 ms，Next.js 全量 SSR 很容易
#    超；付费档（$5/月起）放宽到 10 MiB / 30 s CPU。
# 3. 需装适配器：npm i -D @opennextjs/cloudflare，然后用
#    `npx opennextjs-cloudflare build` + `npx opennextjs-cloudflare deploy`，
#    而不是 `next build`。
# 4. 密钥用 `npx wrangler secret put DEEPSEEK_API_KEY` 放 Cloudflare 侧，
#    不要写进本文件或仓库。
name = "ziwei-commercial"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

[vars]
# NEXT_PUBLIC_SITE_URL 在部署时按实际域名改
NEXT_PUBLIC_SITE_URL = "https://ziwei-commercial.example.workers.dev"
