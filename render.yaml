# Render 部署配置（推荐首选，见 BUILD-NOTES）
# 人工步骤：Render Dashboard → New → Web Service → 连 GitHub 仓库 → 选 Free 套餐
# → Environment 里加 DEEPSEEK_API_KEY（服务端密钥，只放 Dashboard，不进仓库）
# → Create Web Service。首次部署约 3–5 分钟；免费档 15 分钟无流量会休眠，
#   下次访问冷启动约 1 分钟。
services:
  - type: web
    name: ziwei-commercial
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPSEEK_API_KEY
        sync: false
